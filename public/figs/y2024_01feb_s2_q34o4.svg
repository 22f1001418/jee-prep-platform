<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190" font-family="Georgia, 'Times New Roman', serif">
<style>
  .bond{stroke:#000;stroke-width:2;fill:none;}
  .lbl{font-size:15px;fill:#000;}
  .sub{font-size:10px;fill:#000;}
</style>
<!-- benzene ring hexagon centered ~ (85,95) radius 38 -->
<g>
<polygon class="bond" points="85,57 118,76 118,114 85,133 52,114 52,76"/>
<!-- inner aromatic circle -->
<circle cx="85" cy="95" r="22" fill="none" stroke="#000" stroke-width="1.5"/>
</g>
<!-- OH at bottom vertex, going down with H-bond dashed to NO2 oxygen -->
<line class="bond" x1="85" y1="133" x2="85" y2="160"/>
<text class="lbl" x="70" y="178">OH</text>
<!-- NO2 at adjacent vertex (upper right), going up -->
<line class="bond" x1="118" y1="76" x2="150" y2="58"/>
<text class="lbl" x="150" y="52">NO</text>
<text class="sub" x="175" y="56">2</text>
<!-- dashed intramolecular H-bond -->
<line x1="92" y1="158" x2="148" y2="68" stroke="#000" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
