<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Georgia, 'Times New Roman', serif" font-size="15">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="black"/>
  </marker>
</defs>

<!-- helper: benzene ring function drawn manually for each -->

<!-- ============ Option (1) ============ -->
<g transform="translate(10,10)">
<text x="0" y="14" font-weight="bold">(1)</text>
<!-- benzene ring -->
<g transform="translate(20,20)">
  <polygon points="35,0 65,17 65,52 35,69 5,52 5,17" fill="none" stroke="black" stroke-width="1.4"/>
  <polygon points="35,8 58,21 58,48 35,61 12,48 12,21" fill="none" stroke="black" stroke-width="1" stroke-dasharray="0" opacity="0"/>
  <!-- inner circle style aromatic -->
  <circle cx="35" cy="34.5" r="18" fill="none" stroke="black" stroke-width="1"/>
</g>
<!-- substituent CH2-C(=O)-NH2 -->
<line x1="85" y1="37" x2="112" y2="22" stroke="black" stroke-width="1.3"/>
<text x="112" y="20" font-size="14">CH&#8322;&#8211;C&#8211;NH&#8322;</text>
<line x1="150" y1="16" x2="150" y2="4" stroke="black" stroke-width="1.2"/>
<line x1="153" y1="16" x2="153" y2="4" stroke="black" stroke-width="1.2"/>
<text x="144" y="2" font-size="13">O</text>
<!-- arrow -->
<line x1="90" y1="60" x2="190" y2="60" stroke="black" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="95" y="53" font-size="13">Br&#8322;, NaOH</text>
<!-- product benzene -->
<g transform="translate(210,20)">
  <polygon points="35,0 65,17 65,52 35,69 5,52 5,17" fill="none" stroke="black" stroke-width="1.4"/>
  <circle cx="35" cy="34.5" r="18" fill="none" stroke="black" stroke-width="1"/>
</g>
<line x1="275" y1="37" x2="302" y2="22" stroke="black" stroke-width="1.3"/>
<text x="302" y="18" font-size="14">CH&#8322;&#8211;NH&#8322;</text>
</g>

<!-- ============ Option (2) ============ -->
