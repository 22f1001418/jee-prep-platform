<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif">
  <rect width="320" height="260" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="220" x2="60" y2="20" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="220" x2="290" y2="220" stroke="#000" stroke-width="2"/>
  <!-- arrowheads -->
  <polygon points="60,20 55,30 65,30" fill="#000"/>
  <polygon points="290,220 280,215 280,225" fill="#000"/>
  <!-- dashed line segment before A -->
  <line x1="60" y1="200" x2="95" y2="160" stroke="#000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- solid line A to B -->
  <line x1="95" y1="160" x2="220" y2="55" stroke="#000" stroke-width="2"/>
  <!-- points A and B -->
  <circle cx="95" cy="160" r="3.5" fill="#000"/>
  <circle cx="220" cy="55" r="3.5" fill="#000"/>
  <text x="100" y="152" font-size="17">A</text>
  <text x="222" y="48" font-size="17" font-style="italic">B</text>
  <!-- y axis label: log x/m, rotated -->
  <text x="34" y="130" font-size="17" transform="rotate(-90 34 130)" text-anchor="middle">log <tspan font-style="italic">x</tspan>/<tspan font-style="italic">m</tspan></text>
  <!-- x axis label -->
  <text x="175" y="245" font-size="17" text-anchor="middle">log P &#8594;</text>
</svg>
